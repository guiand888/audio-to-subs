name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Install, build, and test frontend
        run: nix develop .#frontend --command bash -c "cd frontend && npm ci && npm run build && npm run test"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') }}

      - name: Run tests with coverage
        run: nix develop --command pytest

      - name: Check code formatting with black
        run: nix develop --command black --check audio_to_subs/ tests/

      - name: Lint with ruff
        run: nix develop --command ruff check audio_to_subs/ tests/

      - name: Type check with mypy
        run: nix develop --command mypy audio_to_subs/

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: nix develop --command genbadge coverage -i coverage.xml -o coverage.svg

      - name: Publish badge to badges branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges
          git worktree add badges-wt badges
          mv coverage.svg badges-wt/coverage.svg
          cd badges-wt
          git add coverage.svg
          git diff --cached --quiet || {
            git commit -m "chore: update coverage badge"
            git push origin badges
          }

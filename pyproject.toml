[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-to-subs"
version = "1.0.0"
description = "Convert video audio to subtitles using AI-powered transcription"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Guillaume Andre", email = "your.email@example.com"}
]
maintainers = [
    {name = "Guillaume Andre", email = "your.email@example.com"}
]
keywords = ["subtitles", "transcription", "video", "audio", "ai", "srt", "mistral"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "mistralai==2.4.5",
    "ffmpeg-python==0.2.0",
    "click==8.1.7",
    "pyyaml==6.0.2",
    # Web framework
    "fastapi==0.110.2",
    "uvicorn[standard]==0.29.0",
    "pydantic>=2.11.2",
    "pydantic-settings>=2.3.2",
    # SSE support
    "sse-starlette==2.1.0",
    # Database
    "sqlalchemy==2.0.31",
    "aiosqlite==0.20.0",
    # Auth
    "argon2-cffi==23.1.0",
    "itsdangerous==2.2.0",
    # Migrations
    "alembic==1.13.2",
    # Redis
    "redis==5.0.3",
    # HTTP client for Bazarr
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-bdd==7.0.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.14.0",
    "pytest-asyncio==0.23.7",
    "responses==0.24.1",
    "respx==0.22.0",
    "genbadge[coverage]==1.1.3",
    "black==24.2.0",
    "ruff==0.3.4",
    "mypy==1.9.0",
    "pre-commit==3.7.0",
    "ipython==8.21.0",
    "types-click==8.1.7",
    "types-PyYAML==6.0.2",
    "types-itsdangerous==2.2.0",
]

[project.urls]
Homepage = "https://github.com/guiand888/audio-to-subs"
Repository = "https://github.com/guiand888/audio-to-subs"
Issues = "https://github.com/guiand888/audio-to-subs/issues"

[project.scripts]
audio-to-subs = "audio_to_subs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_to_subs*"]

[tool.pytest.ini_options]
testpaths = ["tests", "features"]
python_files = ["test_*.py", "*_test.py", "*_steps.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--cov=audio_to_subs",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ffmpeg.*",
    "mistralai.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["audio_to_subs"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

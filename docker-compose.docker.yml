# Standalone env-file alternative to docker-compose.yml.
#
# Use this INSTEAD of docker-compose.yml for deployments that supply
# credentials via a plaintext `.env` file (e.g. Docker, where native secrets
# are not managed the way Podman does). Do NOT merge this with
# docker-compose.yml — run it on its own; docker-compose.override.yml
# (the optional Sonarr/Radarr/Bazarr stack) is auto-included by both engines.
#
#   cp .env.example .env          # then set ADMIN_PASSWORD and MISTRAL_API_KEY
#   docker compose -f docker-compose.docker.yml up -d --build
#   # or, to validate the same mechanism under Podman:
#   podman compose -f docker-compose.docker.yml up -d --build
#
# The application prefers the direct ADMIN_PASSWORD / MISTRAL_API_KEY env vars
# over the *_FILE variants (see audio_to_subs/api/settings.py), so no secret
# files are required here.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-to-subs:backend
    container_name: audio-to-subs-backend
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:////data/audio-to-subs.db
      - SESSION_SECRET_FILE=/data/session_secret
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_USERNAME=admin
      - BEHIND_TLS=false
      - DEBUG=true
      - LOG_LEVEL=INFO
    env_file: ${ENV_FILE:-.env}
    volumes:
      - audio-to-subs-data:/data:z
      - audio-to-subs-movies:/movies:z
      - audio-to-subs-tv:/tv:z
      - audio-to-subs-tmp:/tmp/audio-to-subs:z
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  redis:
    image: docker.io/library/redis:8-alpine
    container_name: audio-to-subs-redis
    ports:
      - "6379:6379"
    volumes:
      - audio-to-subs-redis-data:/data:z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-to-subs:worker
    container_name: audio-to-subs-worker
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:////data/audio-to-subs.db
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SECRET_FILE=/data/session_secret
      - ADMIN_USERNAME=admin
      - BEHIND_TLS=false
      - DEBUG=true
      - LOG_LEVEL=INFO
    env_file: ${ENV_FILE:-.env}
    volumes:
      - audio-to-subs-data:/data:z
      - audio-to-subs-movies:/movies:z
      - audio-to-subs-tv:/tv:z
      - audio-to-subs-tmp:/tmp/audio-to-subs:z
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    entrypoint: ["python", "-m", "audio_to_subs.worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: audio-to-subs:frontend
    container_name: audio-to-subs-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "101:101" # nginx user in nginx-unprivileged image

volumes:
  audio-to-subs-data:
    driver: local
  audio-to-subs-redis-data:
    driver: local
  audio-to-subs-movies:
    driver: local
  audio-to-subs-tv:
    driver: local
  audio-to-subs-tmp:
    driver: local

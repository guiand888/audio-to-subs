# ==============================================================
# DEVELOPMENT PREVIEW ONLY — NEVER USE IN PRODUCTION
# ==============================================================
# This config stubs the backend API so the frontend can be
# previewed from a static dist/ build with no backend running.
#
# Security implications — all deliberate, all wrong for prod:
#   - /api/auth/me always returns a fake user (auth bypassed)
#   - POST /api/auth/login always succeeds (no password check)
#   - Data endpoints return empty payloads
#
# Confinement guarantees:
#   - Listed in frontend/.dockerignore → cannot enter the
#     production image even if accidentally referenced
#   - Production Dockerfile explicitly copies nginx.conf, not
#     this file
#   - Only reachable via the `make frontend-preview` target or
#     the manual podman run command below
#
# Usage (from repo root):
#   podman run --rm -p 8080:80 \
#     -v ./frontend/dist:/usr/share/nginx/html:ro,Z \
#     -v ./frontend/nginx.preview.conf:/etc/nginx/conf.d/default.conf:ro,Z \
#     nginx:1.30-alpine
# ==============================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Auth stubs (bypass all authentication) ---

  location = /api/auth/me {
    add_header Content-Type "application/json" always;
    return 200 '{"id":1,"username":"preview"}';
  }

  location = /api/auth/login {
    add_header Content-Type "application/json" always;
    add_header Set-Cookie "parolesub_session=preview-token; Path=/; SameSite=Lax" always;
    return 200 '{"user":{"id":1,"username":"preview"}}';
  }

  location = /api/auth/logout {
    add_header Set-Cookie "parolesub_session=; Path=/; Max-Age=0" always;
    return 204;
  }

  # --- Data stubs (empty payloads so pages render without error) ---

  location = /api/wanted {
    add_header Content-Type "application/json" always;
    return 200 '{"items":[],"total":0,"last_refreshed_at":null}';
  }

  # Exact match for jobs list (avoids catching /api/jobs/stream)
  location = /api/jobs {
    add_header Content-Type "application/json" always;
    return 200 '{"jobs":[],"total":0,"queued":0,"running":0,"done":0,"failed":0,"cancelled":0}';
  }

  # SSE stream — 204 keeps EventSource alive without sending events;
  # it will auto-reconnect harmlessly in the background
  location /api/jobs/stream {
    return 204;
  }

  # Catch-all for any other /api/ call (settings, logs, etc.)
  location /api/ {
    add_header Content-Type "application/json" always;
    return 404 '{"detail":"not available in preview mode"}';
  }

  # --- SPA fallback (must be last) ---
  location / {
    try_files $uri /index.html;
  }
}

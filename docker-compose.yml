version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-to-subs:backend
    container_name: audio-to-subs-backend
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:////data/audio-to-subs.db
      - SESSION_SECRET_FILE=/data/session_secret
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - BEHIND_TLS=false
      - DEBUG=true
    
    # Secrets for sensitive data
    secrets:
      - admin_password
    
    # Volume mounts
    volumes:
      # Database and session data (shared with worker)
      - audio-to-subs-data:/data:z
      # Movie files (aligned with Radarr/Bazarr)
      - ./movies:/movies:z
      # TV series files (aligned with Sonarr/Bazarr)
      - ./tv:/tv:z
      # Temporary processing
      - /tmp/audio-to-subs:z
    
    # Ports
    ports:
      - "8000:8000"
    
    # Dependencies
    depends_on:
      redis:
        condition: service_healthy
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cps: '0.5'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # User
    user: "1000:1000"

  redis:
    image: redis:8-alpine
    container_name: audio-to-subs-redis
    
    # Ports
    ports:
      - "6379:6379"
    
    # Persistence (optional, Redis can be stateless for our use case)
    volumes:
      - audio-to-subs-redis-data:/data:z
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    
    # Restart policy
    restart: unless-stopped
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # User
    user: "1000:1000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-to-subs:worker
    container_name: audio-to-subs-worker
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:////data/audio-to-subs.db
      - REDIS_URL=redis://redis:6379/0
      - MISTRAL_API_KEY_FILE=/run/secrets/mistral_api_key
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - DEBUG=true
    
    # Secrets for sensitive data
    secrets:
      - mistral_api_key
    
    # Volume mounts (shared with backend)
    volumes:
      - audio-to-subs-data:/data:z
      # Movie and TV files (aligned with Radarr/Sonarr/Bazarr)
      - ./movies:/movies:z
      - ./tv:/tv:z
      - /tmp/audio-to-subs:z
    
    # Dependencies
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # User
    user: "1000:1000"
    
    # Command
    command: python -m audio_to_subs.worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: audio-to-subs:frontend
    container_name: audio-to-subs-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    user: "101:101"  # nginx default user in nginx:alpine

volumes:
  audio-to-subs-data:
    driver: local
  audio-to-subs-redis-data:
    driver: local

secrets:
  admin_password:
    external: true
  mistral_api_key:
    external: true

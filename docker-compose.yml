services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-to-subs:backend
    container_name: audio-to-subs-backend
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:////data/audio-to-subs.db
      - SESSION_SECRET_FILE=/data/session_secret
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - BEHIND_TLS=false
      - DEBUG=true
      - LOG_LEVEL=INFO

    # Secrets for sensitive data
    secrets:
      - admin_password
    volumes:
      # Database and session data (shared with worker)
      - audio-to-subs-data:/data:z
      # Movie files (aligned with Radarr/Bazarr)
      - audio-to-subs-movies:/movies:z
      # TV series files (aligned with Sonarr/Bazarr)
      - audio-to-subs-tv:/tv:z
      # Temporary processing
      - audio-to-subs-tmp:/tmp/audio-to-subs:z
    ports:
      - "8000:8000"
    # Health check (defined here, not in the Dockerfile: Podman builds OCI
    # images and silently drops Dockerfile HEALTHCHECK instructions)
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  redis:
    image: docker.io/library/redis:8-alpine
    container_name: audio-to-subs-redis
    ports:
      - "6379:6379"
    # Persistence (optional, Redis can be stateless for our use case)
    volumes:
      - audio-to-subs-redis-data:/data:z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-to-subs:worker
    container_name: audio-to-subs-worker
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:////data/audio-to-subs.db
      - REDIS_URL=redis://redis:6379/0
      - MISTRAL_API_KEY_FILE=/run/secrets/mistral_api_key
      - SESSION_SECRET_FILE=/data/session_secret
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - DEBUG=true
      - LOG_LEVEL=INFO
    secrets:
      - mistral_api_key
    volumes:
      - audio-to-subs-data:/data:z
      - audio-to-subs-movies:/movies:z
      - audio-to-subs-tv:/tv:z
      - audio-to-subs-tmp:/tmp/audio-to-subs:z
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

    # Entrypoint override: the image's ENTRYPOINT runs uvicorn (the API).
    # The worker must replace it entirely, so override entrypoint (not command,
    # which would just be appended to the uvicorn entrypoint as arguments).
    entrypoint: ["python", "-m", "audio_to_subs.worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: audio-to-subs:frontend
    container_name: audio-to-subs-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "101:101" # nginx user in nginx-unprivileged image

volumes:
  audio-to-subs-data:
    driver: local
  audio-to-subs-redis-data:
    driver: local
  audio-to-subs-movies:
    driver: local
  audio-to-subs-tv:
    driver: local
  audio-to-subs-tmp:
    driver: local

secrets:
  admin_password:
    external: true
  mistral_api_key:
    external: true

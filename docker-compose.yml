version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-to-subs:backend
    container_name: audio-to-subs-backend
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:////data/audio-to-subs.db
      - SESSION_SECRET_FILE=/data/session_secret
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - BEHIND_TLS=false
      - DEBUG=true
    
    # Secrets for sensitive data
    secrets:
      - admin_password
    
    # Volume mounts
    volumes:
      # Database and session data (shared with worker)
      - audio-to-subs-data:/data
      # Input videos (read-only)
      - ./videos:/input:ro
      # Output subtitles
      - ./subtitles:/output:rw
      # Temporary processing
      - /tmp/audio-to-subs
    
    # Ports
    ports:
      - "8000:8000"
    
    # Dependencies
    depends_on:
      redis:
        condition: service_healthy
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cps: '0.5'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # User
    user: "1000:1000"

  redis:
    image: redis:8-alpine
    container_name: audio-to-subs-redis
    
    # Ports
    ports:
      - "6379:6379"
    
    # Persistence (optional, Redis can be stateless for our use case)
    volumes:
      - audio-to-subs-redis-data:/data
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    
    # Restart policy
    restart: unless-stopped
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # User
    user: "1000:1000"

volumes:
  audio-to-subs-data:
    driver: local
  audio-to-subs-redis-data:
    driver: local

secrets:
  admin_password:
    external: true
